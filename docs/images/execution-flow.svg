<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1400" height="820" fill="#fafaf9"/><text x="60" y="60" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#111827">How a request becomes approved work</text><text x="60" y="88" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">The app checks requests, finds allowed information, and waits for approval.</text><rect x="70" y="150" width="230" height="90" rx="14" fill="#eef2ff" stroke="#94a3b8" stroke-width="2"/><text x="185.0" y="178" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">1. Service request</text><text x="185.0" y="204" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">a question about a service case</text><rect x="360" y="150" width="260" height="90" rx="14" fill="#ecfeff" stroke="#94a3b8" stroke-width="2"/><text x="490.0" y="178" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">2. Check the request</text><text x="490.0" y="204" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">flag rule-bypassing or data-seeking requests</text><rect x="690" y="150" width="250" height="90" rx="14" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/><text x="815.0" y="178" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">3. Find allowed information</text><text x="815.0" y="204" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">search manuals and service records</text><rect x="1010" y="150" width="270" height="90" rx="14" fill="#ecfeff" stroke="#94a3b8" stroke-width="2"/><text x="1145.0" y="178" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">4. Label the case</text><text x="1145.0" y="204" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">type, urgency, possible site visit</text><rect x="360" y="350" width="260" height="90" rx="14" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="490.0" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">5. Choose a writing model</text><text x="490.0" y="404" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">use a model allowed to see this information</text><rect x="690" y="350" width="250" height="90" rx="14" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="815.0" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">6. Writing model</text><text x="815.0" y="404" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">write a report with source links</text><rect x="1010" y="350" width="270" height="90" rx="14" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/><text x="1145.0" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">7. Suggested work order</text><text x="1145.0" y="404" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">saved for a manager to review</text><rect x="690" y="560" width="260" height="90" rx="14" fill="#fefce8" stroke="#94a3b8" stroke-width="2"/><text x="820.0" y="588" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">8. Manager approval</text><text x="820.0" y="614" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">check the case, then approve and save</text><rect x="1010" y="560" width="270" height="90" rx="14" fill="#f0f9ff" stroke="#94a3b8" stroke-width="2"/><text x="1145.0" y="588" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#14213d">9. Saved work order</text><text x="1145.0" y="614" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#334155">work order in the sample system</text><line x1="300" y1="195" x2="360" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="620" y1="195" x2="690" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="655.0" y="187.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#475569">allowed request</text><line x1="940" y1="195" x2="1010" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="490" y1="240" x2="490" y2="350" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="620" y1="395" x2="690" y2="395" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="940" y1="395" x2="1010" y2="395" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1145" y1="440" x2="1145" y2="560" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="950" y1="605" x2="1010" y2="605" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M490 240 C490 290, 220 290, 220 350" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="350" width="230" height="90" rx="14" fill="#fff1f2" stroke="#fca5a5" stroke-width="2"/><text x="185" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">Blocked request</text><text x="185" y="404" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7f1d1d">no document search or answer,</text><text x="185" y="422" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7f1d1d">no work order</text></svg>